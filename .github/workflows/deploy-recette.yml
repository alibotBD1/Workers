name: Déployer la recette

# La branche « recette » est publiée sur Firebase Hosting (projet workers-recette)
# avec ses propres comptes et sa propre base de test. Les règles de sécurité
# et les index sont déployés en même temps.
on:
  push:
    branches: [recette]
  workflow_dispatch:

concurrency:
  group: recette
  cancel-in-progress: true

jobs:
  recette:
    runs-on: ubuntu-latest
    environment: recette
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/collecte/outils.test.mjs
      - name: Build (recette)
        run: npm run build
        env:
          BASE_PATH: /
          VITE_GITHUB_REPO: ${{ github.repository }}
          VITE_DEMO: "true"
          VITE_ENV: recette
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      - name: Déployer sur Firebase (hébergement, règles, index)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          npx --yes firebase-tools@latest deploy --only hosting,firestore,storage --project recette --non-interactive
          rm -f "$RUNNER_TEMP/cle.json"
